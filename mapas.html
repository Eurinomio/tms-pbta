<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Editor Táctico de Mapas - PbtA</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-color: #f1f5f9;
      --card-bg: #ffffff;
      --border-color: #cbd5e1;
      --accent-color: #1e293b;
      --accent-active: #0f172a;
      --text-main: #0f172a;
      --text-muted: #64748b;
      --radius: 6px;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Inter', sans-serif;
      background-color: var(--bg-color);
      color: var(--text-main);
      padding: 10px;
      display: flex;
      justify-content: center;
      min-height: 100vh;
    }

    .editor-container {
      width: 100%;
      max-width: 1000px;
      background: var(--card-bg);
      border-radius: var(--radius);
      box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.1);
      padding: 15px;
      border: 1px solid var(--border-color);
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .editor-header {
      border-bottom: 2px solid var(--accent-color);
      padding-bottom: 10px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 8px;
    }

    .editor-title-group {
      display: flex;
      align-items: center;
      gap: 10px;
      flex-wrap: wrap;
      flex-grow: 1;
    }

    .editor-title {
      font-family: 'Cinzel', serif;
      font-size: 1.1rem;
      font-weight: 700;
      color: var(--accent-color);
    }

    .map-name-input {
      padding: 5px 8px;
      font-size: 0.8rem;
      font-weight: 600;
      border: 1px solid var(--border-color);
      border-radius: 4px;
      min-width: 180px;
      color: var(--text-main);
      background: #f8fafc;
    }

    .toolbar {
      display: flex;
      gap: 6px;
      flex-wrap: wrap;
      align-items: center;
    }

    button, label.btn {
      background: var(--accent-color);
      color: white;
      border: none;
      padding: 6px 10px;
      border-radius: 4px;
      font-size: 0.75rem;
      font-weight: 600;
      font-family: 'Inter', sans-serif;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 4px;
      transition: all 0.2s;
    }

    button:hover, label.btn:hover {
      background: var(--accent-active);
      transform: translateY(-1px);
    }

    button.btn-drive {
      background: #0f766e;
    }

    button.btn-drive:hover {
      background: #115e59;
    }

    /* PALETA DE HERRAMIENTAS Y PINTURA */
    .palette-section {
      display: flex;
      flex-direction: column;
      gap: 6px;
      background: #f8fafc;
      padding: 8px 10px;
      border-radius: var(--radius);
      border: 1px solid var(--border-color);
    }

    .palette-row {
      display: flex;
      gap: 5px;
      align-items: center;
      flex-wrap: wrap;
    }

    .palette-label {
      font-size: 0.7rem;
      font-family: 'Cinzel', serif;
      font-weight: 700;
      color: var(--text-muted);
      margin-right: 4px;
      min-width: 70px;
    }

    .tool-btn {
      padding: 5px 8px;
      font-size: 0.7rem;
      background: #e2e8f0;
      color: #334155;
      border: 1px solid transparent;
      border-radius: 4px;
      cursor: pointer;
    }

    .tool-btn.active {
      background: var(--accent-color);
      color: white;
      border-color: #0284c7;
    }

    /* BARRA PARA AÑADIR TEXTO FLOTANTE */
    .text-tool-bar {
      display: flex;
      gap: 6px;
      align-items: center;
      background: #f1f5f9;
      padding: 8px 10px;
      border-radius: var(--radius);
      border: 1px solid var(--border-color);
      flex-wrap: wrap;
    }

    .text-tool-bar input {
      padding: 5px 8px;
      font-size: 0.8rem;
      border: 1px solid var(--border-color);
      border-radius: 4px;
      flex-grow: 1;
      min-width: 150px;
    }

    /* CONTENEDOR RESPONSIVE OPTIMIZADO PARA MÓVIL */
    .canvas-wrapper {
      display: flex;
      justify-content: center;
      align-items: center;
      background: #0f172a;
      border-radius: var(--radius);
      padding: 10px;
      overflow: auto;
      border: 1px solid var(--border-color);
      position: relative;
      width: 100%;
    }

    canvas {
      background: #020617;
      box-shadow: 0 10px 20px rgba(0,0,0,0.5);
      border-radius: 4px;
      cursor: crosshair;
      width: 100%;
      max-width: 500px;
      height: auto;
      aspect-ratio: 1 / 1;
      touch-action: none;
    }

    .editor-footer {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 0.75rem;
      color: var(--text-muted);
      background: #f8fafc;
      padding: 8px 12px;
      border: 1px solid var(--border-color);
      border-radius: var(--radius);
      flex-wrap: wrap;
      gap: 6px;
    }

    .toast-msg {
      position: fixed;
      bottom: 18px;
      right: 18px;
      background: #0f172a;
      color: #ffffff;
      padding: 10px 14px;
      border-radius: 6px;
      font-size: 0.82rem;
      font-weight: 500;
      box-shadow: 0 10px 20px rgba(0, 0, 0, 0.25);
      z-index: 3000;
      opacity: 0;
      transform: translateY(8px);
      transition: all 0.2s ease;
      pointer-events: none;
      max-width: 360px;
    }

    .toast-msg.show {
      opacity: 1;
      transform: translateY(0);
    }

    @media print {
      body { background: white; padding: 0; }
      .action-bar, .palette-section, .text-tool-bar, .toolbar, .toast-msg { display: none !important; }
      .editor-container { box-shadow: none; border: none; width: 100%; max-width: 100%; padding: 0; }
    }
  </style>
</head>
<body>

</style>

<nav class="tms-fixed-nav" aria-label="Navegación principal del sitio">

  <a href="manual.html">Manual de reglas</a>

  <div class="editor-container">
    <div class="editor-header">
      <div class="editor-title-group">
        <div class="editor-title">🗺️ Editor Táctico PbtA</div>
        <input type="text" id="mapNameInput" class="map-name-input" placeholder="Nombre del mapa (opcional)..." oninput="saveLocalMapState()">
      </div>
      <div class="toolbar">
        <button class="btn-drive" onclick="saveMapToGoogleDrive()">☁️ Guardar en Drive</button>
        <button class="btn-drive" onclick="loadMapFromGoogleDrive()">📥 Cargar de Drive</button>
        <button onclick="printMap()">🖨️ Imprimir</button>
        <button onclick="exportMapJson()">💾 Guardar</button>
        <label class="btn">
          📂 Cargar
          <input type="file" id="importFile" accept=".json" style="display:none;" onchange="importMapJson(event)">
        </label>
      </div>
    </div>

    <!-- PALETA DE PINTURA -->
    <div class="palette-section">
      <div class="palette-row">
        <span class="palette-label">Terreno:</span>
        <button class="tool-btn active" id="tool-floor" onclick="setTool('floor')">🟩 Suelo</button>
        <button class="tool-btn" id="tool-wall" onclick="setTool('wall')">⬛ Muro</button>
        <button class="tool-btn" id="tool-water" onclick="setTool('water')">🟦 Agua</button>
        <button class="tool-btn" id="tool-lava" onclick="setTool('lava')">🟥 Lava</button>
      </div>
      <div class="palette-row">
        <span class="palette-label">Objetos:</span>
        <button class="tool-btn" id="tool-door1" onclick="setTool('door1')">🚪 Puerta A</button>
        <button class="tool-btn" id="tool-door2" onclick="setTool('door2')">🚪 Puerta B</button>
        <button class="tool-btn" id="tool-obj" onclick="setTool('obj')">📦 Tesoro</button>
        <button class="tool-btn" id="tool-magic_obj" onclick="setTool('magic_obj')">🔮 Objeto mágico</button>
      </div>
      <div class="palette-row">
        <span class="palette-label">Entidades:</span>
        <button class="tool-btn" id="tool-pnj_neutral" onclick="setTool('pnj_neutral')">🟡 Neutral</button>
        <button class="tool-btn" id="tool-pnj_enemy" onclick="setTool('pnj_enemy')">🔴 Enemigo</button>
        <button class="tool-btn" id="tool-animal" onclick="setTool('animal')">🐾 Animal</button>
        <button class="tool-btn" id="tool-boss" onclick="setTool('boss')">👑 Boss</button>
        <button class="tool-btn" id="tool-erase" onclick="setTool('erase')">❌ Borrar</button>
      </div>
    </div>

    <!-- HERRAMIENTA DE TEXTO FLOTANTE -->
    <div class="text-tool-bar">
      <span class="palette-label">Texto:</span>
      <input type="text" id="floatingTextInput" placeholder="Ej. Sala del Trono..." maxlength="25">
      <button onclick="setTool('text')">📍 Poner</button>
      <button onclick="clearTexts()" style="background:#64748b;">Limpiar</button>
    </div>

    <!-- CONTENEDOR ADAPTADO -->
    <div class="canvas-wrapper">
      <canvas id="editorCanvas" width="640" height="640"></canvas>
    </div>

    <div class="editor-footer">
      <span id="statusText">Herramienta: <strong>Suelo</strong></span>
      <span>40 x 40</span>
    </div>
  </div>

  <div id="toastMsg" class="toast-msg"></div>

  <script>
    const canvas = document.getElementById('editorCanvas');
    const ctx = canvas.getContext('2d');
    
    const cols = 40;
    const rows = 40;
    const tileSize = 16;
    
    let mapData = Array(rows).fill().map(() => Array(cols).fill(0));
    let textLabels = [];
    
    let currentTool = 'floor';
    let isDrawing = false;

    const LOCAL_MAP_STORAGE_KEY = 'pbta_map_editor_data_v1';

    // --- CONFIGURACIÓN Y ESTADO DE GOOGLE DRIVE (TMS PBTA / MAPAS) ---
    const DRIVE_CONFIG = {
      clientId: '3720906139-udra1unbra3vjpuogv200hgipur8dcrv.apps.googleusercontent.com',
      rootFolderId: '',
      rootFolderName: 'TMS PBTA',
      subFolderName: 'MAPAS',
      scope: 'https://www.googleapis.com/auth/drive.file'
    };

    const DRIVE_META_STORAGE_KEY = 'pbta_mapas_drive_link_v1';

    let driveAccessToken = null;
    let driveTokenExpiresAt = 0;
    let tokenClient = null;
    let pendingAuthResolver = null;
    let pendingAuthRejecter = null;

    let cachedRootFolderId = DRIVE_CONFIG.rootFolderId || null;
    let cachedMapasFolderId = null;

    const terrainColors = {
      0: '#0f172a',
      1: '#334155',
      2: '#0284c7',
      3: '#dc2626',
      4: '#d97706',
      5: '#10b981',
      6: '#facc15',
      7: '#ef4444',
      8: '#ef4444',
      9: '#a855f7',
      10: '#f97316',
      11: '#ec4899'
    };

    function showToast(message) {
      const toast = document.getElementById('toastMsg');
      if (!toast) return;
      toast.textContent = message;
      toast.classList.add('show');
      clearTimeout(window.__toastTimer);
      window.__toastTimer = setTimeout(() => {
        toast.classList.remove('show');
      }, 3600);
    }

    function getMapNameInputValue() {
      const el = document.getElementById('mapNameInput');
      return el ? el.value.trim() : '';
    }

    function getSanitizedMapFilename() {
      const raw = getMapNameInputValue();
      if (!raw) return 'mapa_tactico_pbta.json';
      const slug = raw.toLowerCase().replace(/\s+/g, '_').replace(/[^a-z0-9_-]/g, '');
      return slug ? `mapa_${slug}.json` : 'mapa_tactico_pbta.json';
    }

    function saveLocalMapState() {
      try {
        const state = {
          name: getMapNameInputValue(),
          mapData: mapData,
          textLabels: textLabels
        };
        localStorage.setItem(LOCAL_MAP_STORAGE_KEY, JSON.stringify(state));
      } catch (_) {}
    }

    function loadLocalMapState() {
      try {
        const raw = localStorage.getItem(LOCAL_MAP_STORAGE_KEY);
        if (!raw) return;
        const parsed = JSON.parse(raw);
        if (parsed.mapData && parsed.textLabels) {
          mapData = parsed.mapData;
          textLabels = parsed.textLabels;
        }
        const nameEl = document.getElementById('mapNameInput');
        if (nameEl && typeof parsed.name === 'string') {
          nameEl.value = parsed.name;
        }
      } catch (_) {}
    }

    function setTool(tool) {
      currentTool = tool;
      document.querySelectorAll('.tool-btn').forEach(btn => btn.classList.remove('active'));
      if(tool !== 'text') {
        document.getElementById(`tool-${tool}`).classList.add('active');
      }
      
      let names = { 
        floor: 'Suelo', wall: 'Muro / Roca', water: 'Agua', lava: 'Lava',
        door1: 'Puerta A (Rojo)', door2: 'Puerta B (Ámbar)', obj: 'Objeto / Tesoro', magic_obj: 'Objeto mágico (Sello / Altar)',
        pnj_neutral: 'PNJ Neutral', pnj_enemy: 'PNJ Enemigo', animal: 'Animal', boss: 'Boss', erase: 'Borrar Celda',
        text: 'Añadir Texto (Haz clic en una celda)'
      };
      document.getElementById('statusText').innerHTML = `Herramienta: <strong>${names[tool]}</strong>`;
    }

    function drawMap() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      
      for (let r = 0; r < rows; r++) {
        for (let c = 0; c < cols; c++) {
          let cell = mapData[r][c];
          if (cell > 0) {
            ctx.fillStyle = terrainColors[cell];
            
            if (cell === 6 || cell === 7 || cell === 10 || cell === 11) {
              ctx.fillStyle = '#1e293b';
              ctx.fillRect(c * tileSize, r * tileSize, tileSize - 1, tileSize - 1);
              
              ctx.beginPath();
              ctx.arc(c * tileSize + tileSize/2, r * tileSize + tileSize/2, tileSize/2 - 2, 0, Math.PI * 2);
              ctx.fillStyle = terrainColors[cell];
              ctx.fill();
              ctx.strokeStyle = '#ffffff';
              ctx.lineWidth = 1;
              ctx.stroke();
            } else if (cell === 3 || cell === 4 || cell === 5 || cell === 9) {
              ctx.fillStyle = '#1e293b';
              ctx.fillRect(c * tileSize, r * tileSize, tileSize - 1, tileSize - 1);
              ctx.fillStyle = terrainColors[cell];
              ctx.fillRect(c * tileSize + 2, r * tileSize + 2, tileSize - 5, tileSize - 5);
            } else {
              ctx.fillRect(c * tileSize, r * tileSize, tileSize - 1, tileSize - 1);
            }
          } else {
            ctx.fillStyle = terrainColors[0];
            ctx.fillRect(c * tileSize, r * tileSize, tileSize - 1, tileSize - 1);
          }
        }
      }

      ctx.font = 'bold 11px Inter, sans-serif';
      ctx.textAlign = 'center';
      textLabels.forEach(label => {
        let px = label.c * tileSize + tileSize / 2;
        let py = label.r * tileSize + tileSize / 2;

        let textWidth = ctx.measureText(label.text).width;
        ctx.fillStyle = 'rgba(15, 23, 42, 0.85)';
        ctx.fillRect(px - textWidth/2 - 4, py - 8, textWidth + 8, 16);
        ctx.strokeStyle = '#38bdf8';
        ctx.lineWidth = 1;
        ctx.strokeRect(px - textWidth/2 - 4, py - 8, textWidth + 8, 16);

        ctx.fillStyle = '#f8fafc';
        ctx.fillText(label.text, px, py + 4);
      });
    }

    function handleCanvasInteraction(clientX, clientY) {
      const rect = canvas.getBoundingClientRect();
      const scaleX = canvas.width / rect.width;
      const scaleY = canvas.height / rect.height;

      const x = (clientX - rect.left) * scaleX;
      const y = (clientY - rect.top) * scaleY;
      
      const c = Math.floor(x / tileSize);
      const r = Math.floor(y / tileSize);

      if (r >= 0 && r < rows && c >= 0 && c < cols) {
        if (currentTool === 'text') {
          let textVal = document.getElementById('floatingTextInput').value.trim();
          if (textVal) {
            textLabels = textLabels.filter(l => !(l.r === r && l.c === c));
            textLabels.push({ r, c, text: textVal });
            drawMap();
            saveLocalMapState();
          }
        } else {
          let val = 0;
          if (currentTool === 'floor') val = 1;
          if (currentTool === 'wall') val = 0;
          if (currentTool === 'water') val = 2;
          if (currentTool === 'lava') val = 8;
          if (currentTool === 'door1') val = 3;
          if (currentTool === 'door2') val = 4;
          if (currentTool === 'obj') val = 5;
          if (currentTool === 'magic_obj') val = 9;
          if (currentTool === 'pnj_neutral') val = 6;
          if (currentTool === 'pnj_enemy') val = 7;
          if (currentTool === 'animal') val = 10;
          if (currentTool === 'boss') val = 11;
          if (currentTool === 'erase') {
            val = 0;
            textLabels = textLabels.filter(l => !(l.r === r && l.c === c));
          }

          if (mapData[r][c] !== val) {
            mapData[r][c] = val;
            drawMap();
            saveLocalMapState();
          }
        }
      }
    }

    // Eventos de Ratón
    canvas.addEventListener('mousedown', (e) => { isDrawing = true; handleCanvasInteraction(e.clientX, e.clientY); });
    window.addEventListener('mouseup', () => { isDrawing = false; });
    canvas.addEventListener('mousemove', (e) => { if (isDrawing && currentTool !== 'text') handleCanvasInteraction(e.clientX, e.clientY); });

    // Eventos Táctiles para Móviles
    canvas.addEventListener('touchstart', (e) => {
      isDrawing = true;
      if (e.touches.length > 0) {
        handleCanvasInteraction(e.touches[0].clientX, e.touches[0].clientY);
      }
      e.preventDefault();
    }, { passive: false });

    window.addEventListener('touchend', () => { isDrawing = false; });

    canvas.addEventListener('touchmove', (e) => {
      if (isDrawing && currentTool !== 'text' && e.touches.length > 0) {
        handleCanvasInteraction(e.touches[0].clientX, e.touches[0].clientY);
      }
      e.preventDefault();
    }, { passive: false });

    function clearTexts() {
      textLabels = [];
      drawMap();
      saveLocalMapState();
    }

    function buildMapPayloadString() {
      const saveData = { mapData: mapData, textLabels: textLabels };
      return JSON.stringify(saveData);
    }

    function applyParsedMapData(parsed, fallbackName = '') {
      if (!parsed || !parsed.mapData || !parsed.textLabels) {
        throw new Error('Formato de mapa no válido.');
      }
      mapData = parsed.mapData;
      textLabels = parsed.textLabels;
      const nameEl = document.getElementById('mapNameInput');
      if (nameEl && fallbackName && !nameEl.value.trim()) {
        nameEl.value = fallbackName.replace(/\.json$/i, '').replace(/^mapa_/i, '').replace(/_/g, ' ');
      }
      drawMap();
      saveLocalMapState();
    }

    function exportMapJson() {
      const saveData = { mapData: mapData, textLabels: textLabels };
      const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(saveData));
      const a = document.createElement('a');
      a.href = dataStr;
      a.download = getSanitizedMapFilename();
      a.click();
    }

    function importMapJson(event) {
      const file = event.target.files[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = function(e) {
        try {
          const parsed = JSON.parse(e.target.result);
          applyParsedMapData(parsed, file.name);
        } catch (err) {
          alert(err.message || 'Error al leer el archivo JSON.');
        }
      };
      reader.readAsText(file);
      event.target.value = '';
    }

    // --- INTEGRACIÓN GOOGLE DRIVE (TMS PBTA / MAPAS) ---
    function loadGoogleIdentityScript() {
      return new Promise((resolve, reject) => {
        if (window.google && window.google.accounts && window.google.accounts.oauth2) {
          resolve();
          return;
        }
        const existing = document.querySelector('script[src="https://accounts.google.com/gsi/client"]');
        if (existing) {
          existing.addEventListener('load', () => resolve());
          existing.addEventListener('error', () => reject(new Error('No se pudo cargar Google Identity Services.')));
          return;
        }
        const script = document.createElement('script');
        script.src = 'https://accounts.google.com/gsi/client';
        script.async = true;
        script.defer = true;
        script.onload = () => resolve();
        script.onerror = () => reject(new Error('No se pudo cargar Google Identity Services.'));
        document.head.appendChild(script);
      });
    }

    async function getDriveAccessToken(promptMode = 'consent') {
      if (!DRIVE_CONFIG.clientId) {
        throw new Error('Falta configurar DRIVE_CONFIG.clientId con tu Web Client ID de Google Cloud.');
      }
      if (driveAccessToken && Date.now() < driveTokenExpiresAt - 15000) {
        return driveAccessToken;
      }

      await loadGoogleIdentityScript();

      return new Promise((resolve, reject) => {
        pendingAuthResolver = resolve;
        pendingAuthRejecter = reject;

        tokenClient = window.google.accounts.oauth2.initTokenClient({
          client_id: DRIVE_CONFIG.clientId,
          scope: DRIVE_CONFIG.scope,
          callback: (tokenResponse) => {
            if (tokenResponse && tokenResponse.error) {
              const err = new Error(tokenResponse.error_description || tokenResponse.error);
              if (pendingAuthRejecter) pendingAuthRejecter(err);
              pendingAuthResolver = null;
              pendingAuthRejecter = null;
              return;
            }
            if (tokenResponse && tokenResponse.access_token) {
              driveAccessToken = tokenResponse.access_token;
              const expiresInSec = Number(tokenResponse.expires_in || 3600);
              driveTokenExpiresAt = Date.now() + expiresInSec * 1000;
              if (pendingAuthResolver) pendingAuthResolver(driveAccessToken);
              pendingAuthResolver = null;
              pendingAuthRejecter = null;
            }
          },
          error_callback: (err) => {
            if (pendingAuthRejecter) {
              pendingAuthRejecter(new Error((err && err.message) || 'Error de autenticación en Google.'));
            }
            pendingAuthResolver = null;
            pendingAuthRejecter = null;
          }
        });

        tokenClient.requestAccessToken({ prompt: promptMode });
      });
    }

    async function driveApiFetch(url, options = {}) {
      const token = await getDriveAccessToken('');
      const headers = Object.assign({}, options.headers || {}, {
        'Authorization': `Bearer ${token}`
      });
      const response = await fetch(url, Object.assign({}, options, { headers }));
      if (response.status === 401) {
        driveAccessToken = null;
        driveTokenExpiresAt = 0;
        const freshToken = await getDriveAccessToken('consent');
        headers['Authorization'] = `Bearer ${freshToken}`;
        const retryResponse = await fetch(url, Object.assign({}, options, { headers }));
        if (!retryResponse.ok) {
          throw new Error(`Error de Google Drive (${retryResponse.status})`);
        }
        return retryResponse;
      }
      if (!response.ok) {
        const text = await response.text();
        throw new Error(`Error de Google Drive (${response.status}): ${text}`);
      }
      return response;
    }

    function escapeDriveQueryValue(val) {
      return String(val).replace(/\\/g, '\\\\').replace(/'/g, "\\'");
    }

    async function findOrCreateFolder(folderName, parentId = null) {
      const qParts = [
        `mimeType = 'application/vnd.google-apps.folder'`,
        `name = '${escapeDriveQueryValue(folderName)}'`,
        `trashed = false`
      ];
      if (parentId) {
        qParts.push(`'${escapeDriveQueryValue(parentId)}' in parents`);
      }

      const query = encodeURIComponent(qParts.join(' and '));
      const searchResp = await driveApiFetch(`https://www.googleapis.com/drive/v3/files?q=${query}&fields=files(id,name)&pageSize=10`);
      const searchJson = await searchResp.json();

      if (searchJson.files && searchJson.files.length > 0) {
        return searchJson.files[0].id;
      }

      const metadata = {
        name: folderName,
        mimeType: 'application/vnd.google-apps.folder'
      };
      if (parentId) {
        metadata.parents = [parentId];
      }

      const createResp = await driveApiFetch('https://www.googleapis.com/drive/v3/files?fields=id,name', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(metadata)
      });
      const createdJson = await createResp.json();
      return createdJson.id;
    }

    async function ensureMapasFolderId() {
      if (cachedMapasFolderId) return cachedMapasFolderId;

      if (!cachedRootFolderId) {
        cachedRootFolderId = await findOrCreateFolder(DRIVE_CONFIG.rootFolderName, null);
      }
      cachedMapasFolderId = await findOrCreateFolder(DRIVE_CONFIG.subFolderName, cachedRootFolderId);
      return cachedMapasFolderId;
    }

    function readDriveLinkMeta() {
      try {
        return JSON.parse(localStorage.getItem(DRIVE_META_STORAGE_KEY) || '{}');
      } catch (_) {
        return {};
      }
    }

    function writeDriveLinkMeta(meta) {
      localStorage.setItem(DRIVE_META_STORAGE_KEY, JSON.stringify(meta));
    }

    async function saveMapToGoogleDrive() {
      try {
        saveLocalMapState();
        showToast('Conectando con Google Drive...');
        const folderId = await ensureMapasFolderId();
        const fileName = getSanitizedMapFilename();
        const payloadString = buildMapPayloadString();
        const meta = readDriveLinkMeta();

        let targetFileId = meta[fileName] || null;

        if (!targetFileId) {
          const q = encodeURIComponent(
            `name = '${escapeDriveQueryValue(fileName)}' and '${escapeDriveQueryValue(folderId)}' in parents and trashed = false`
          );
          const listResp = await driveApiFetch(`https://www.googleapis.com/drive/v3/files?q=${q}&fields=files(id,name)&pageSize=1`);
          const listJson = await listResp.json();
          if (listJson.files && listJson.files.length > 0) {
            targetFileId = listJson.files[0].id;
          }
        }

        const boundary = '-------tms_pbta_boundary_' + Date.now();
        const delimiter = `\r\n--${boundary}\r\n`;
        const closeDelimiter = `\r\n--${boundary}--`;

        if (targetFileId) {
          const updateMetadata = { name: fileName, mimeType: 'application/json' };
          const body =
            delimiter +
            'Content-Type: application/json; charset=UTF-8\r\n\r\n' +
            JSON.stringify(updateMetadata) +
            delimiter +
            'Content-Type: application/json\r\n\r\n' +
            payloadString +
            closeDelimiter;

          const updResp = await driveApiFetch(
            `https://www.googleapis.com/upload/drive/v3/files/${encodeURIComponent(targetFileId)}?uploadType=multipart&fields=id,name`,
            {
              method: 'PATCH',
              headers: { 'Content-Type': `multipart/related; boundary="${boundary}"` },
              body
            }
          );
          const updJson = await updResp.json();
          meta[fileName] = updJson.id;
          writeDriveLinkMeta(meta);
          showToast(`Actualizado en Drive (${DRIVE_CONFIG.rootFolderName}/${DRIVE_CONFIG.subFolderName}/${fileName}).`);
        } else {
          const createMetadata = {
            name: fileName,
            mimeType: 'application/json',
            parents: [folderId]
          };
          const body =
            delimiter +
            'Content-Type: application/json; charset=UTF-8\r\n\r\n' +
            JSON.stringify(createMetadata) +
            delimiter +
            'Content-Type: application/json\r\n\r\n' +
            payloadString +
            closeDelimiter;

          const crtResp = await driveApiFetch(
            'https://www.googleapis.com/upload/drive/v3/files?uploadType=multipart&fields=id,name',
            {
              method: 'POST',
              headers: { 'Content-Type': `multipart/related; boundary="${boundary}"` },
              body
            }
          );
          const crtJson = await crtResp.json();
          meta[fileName] = crtJson.id;
          writeDriveLinkMeta(meta);
          showToast(`Guardado en Drive (${DRIVE_CONFIG.rootFolderName}/${DRIVE_CONFIG.subFolderName}/${fileName}).`);
        }
      } catch (err) {
        console.error(err);
        showToast(`No se pudo guardar en Drive: ${err.message}`);
      }
    }

    async function loadMapFromGoogleDrive() {
      try {
        showToast('Buscando mapas en Drive...');
        const folderId = await ensureMapasFolderId();
        const q = encodeURIComponent(
          `'${escapeDriveQueryValue(folderId)}' in parents and mimeType != 'application/vnd.google-apps.folder' and trashed = false`
        );
        const listResp = await driveApiFetch(
          `https://www.googleapis.com/drive/v3/files?q=${q}&fields=files(id,name,modifiedTime)&orderBy=modifiedTime desc&pageSize=30`
        );
        const listJson = await listResp.json();
        const files = listJson.files || [];

        if (files.length === 0) {
          showToast(`No hay mapas en ${DRIVE_CONFIG.rootFolderName}/${DRIVE_CONFIG.subFolderName}.`);
          return;
        }

        const opciones = files
          .map((f, idx) => `${idx + 1}. ${f.name}`)
          .join('\n');
        const selection = prompt(
          `Selecciona el número del mapa a cargar desde ${DRIVE_CONFIG.rootFolderName}/${DRIVE_CONFIG.subFolderName}:\n\n${opciones}`,
          '1'
        );
        if (!selection) return;

        const chosenIndex = parseInt(selection.trim(), 10) - 1;
        if (isNaN(chosenIndex) || chosenIndex < 0 || chosenIndex >= files.length) {
          showToast('Selección no válida.');
          return;
        }

        const chosenFile = files[chosenIndex];
        const fileResp = await driveApiFetch(
          `https://www.googleapis.com/drive/v3/files/${encodeURIComponent(chosenFile.id)}?alt=media`
        );
        const rawText = await fileResp.text();
        const parsed = JSON.parse(rawText);
        applyParsedMapData(parsed, chosenFile.name);

        const meta = readDriveLinkMeta();
        meta[chosenFile.name] = chosenFile.id;
        writeDriveLinkMeta(meta);

        showToast(`Cargado "${chosenFile.name}" desde Google Drive.`);
      } catch (err) {
        console.error(err);
        showToast(`No se pudo cargar desde Drive: ${err.message}`);
      }
    }

    function printMap() {
      const dataUrl = canvas.toDataURL();
      const mapTitle = getMapNameInputValue() || 'Mapa Táctico de Campaña';
      const printHtml = `
        <!DOCTYPE html>
        <html lang="es">
        <head><meta charset="UTF-8"><title>${mapTitle}</title>
        <style>body{text-align:center;padding:20px;font-family:sans-serif;} img{max-width:100%;border:2px solid #334155;}</style></head>
        <body><h2>🗺️ ${mapTitle}</h2><img src="${dataUrl}">
        <script>window.onload=function(){window.print();window.close();}<\/script></body></html>
      `;
      const printWin = window.open('', '_blank');
      if (printWin) {
        printWin.document.write(printHtml);
        printWin.document.close();
      } else {
        window.print();
      }
    }

    loadLocalMapState();
    drawMap();
  </script>
</body>
